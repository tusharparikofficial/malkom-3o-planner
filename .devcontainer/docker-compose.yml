services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:22
    volumes:
      - ..:/workspaces/malkom-3o-planner:cached
    command: sleep infinity
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: malkom
      POSTGRES_PASSWORD: malkom
      POSTGRES_DB: malkom
    volumes:
      - malkom-cs-pgdata:/var/lib/postgresql/data

volumes:
  malkom-cs-pgdata:
