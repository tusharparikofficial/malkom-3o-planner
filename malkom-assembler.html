<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Malkom 3.0 — Process Assembler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EFEEE9;--surface:#FBFAF7;--surface2:#F5F4EF;--surface3:#EAE8E0;
  --ink:#181A19;--ink2:#4A4E4B;--ink3:#7C807C;
  --rule:#D6D4CA;--rule2:#C2BFB3;
  --marine:#0F5C4A;--marineLo:#E4EDE9;--marineHi:#15806A;
  --slate:#3C5A6B;--slateLo:#E7EDF0;
  --amber:#B8710A;--amberLo:#F7EEDD;
  --plum:#6B3F5E;--plumLo:#F0E8ED;
  --rust:#A32B1E;--rustLo:#F7E5E2;
  --r:4px;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',system-ui,sans-serif;--cond:'IBM Plex Sans Condensed',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--marine);outline-offset:1px}
svg{display:block;flex-shrink:0}
.lbl{font-family:var(--cond);font-weight:600;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* shell */
#app{display:flex;flex-direction:column;height:100vh}
#top{display:flex;align-items:center;gap:16px;height:50px;padding:0 16px;background:var(--ink);color:#E8EAE8;flex-shrink:0}
#top .bd{display:flex;align-items:baseline;gap:8px}
#top .bd b{font-size:14px;font-weight:600;letter-spacing:-.01em;color:#fff}
#top .bd span{font-family:var(--cond);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#7C807C}
#steps{display:flex;gap:2px;margin-left:6px}
.stp{display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;color:#9DA19E;font-size:12px}
.stp b{font-family:var(--mono);font-size:10px;width:15px;height:15px;border-radius:99px;background:#2E322F;color:#9DA19E;display:grid;place-items:center;font-weight:500}
.stp:hover{color:#E8EAE8}
.stp.on{background:#252927;color:#fff}
.stp.on b{background:var(--marineHi);color:#06231C}
.stp.done b{background:#3A4340;color:var(--marineHi)}
#top .rt{margin-left:auto;display:flex;align-items:center;gap:8px}
.tbtn{display:flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid #383C39;border-radius:var(--r);color:#C6C9C6;font-size:12px}
.tbtn:hover{background:#252927;border-color:#4C514E;color:#fff}
.tbtn.go{background:var(--marineHi);border-color:var(--marineHi);color:#06231C;font-weight:600}
.tbtn.go:hover{background:#1A9880}

/* live meters */
#meters{display:flex;gap:0;align-items:center;padding-left:14px;margin-left:4px;border-left:1px solid #2E322F}
.mtr{padding:0 12px;border-right:1px solid #2E322F}
.mtr:last-child{border:0}
.mtr .v{font-family:var(--mono);font-size:13px;color:#fff;font-variant-numeric:tabular-nums;line-height:1.15}
.mtr .k{font-family:var(--cond);font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:#7C807C}
.mtr.hero .v{color:var(--marineHi);font-weight:600}

#body{flex:1;overflow:hidden;display:flex}
.scroll{overflow:auto;height:100%}
.wrap{max-width:1080px;margin:0 auto;padding:26px 24px 40px}
h3.sec{font-size:17px;font-weight:600;letter-spacing:-.015em;margin-bottom:3px}
p.sub{color:var(--ink2);font-size:13px;margin-bottom:20px;max-width:620px}

/* vertical cards */
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(238px,1fr));gap:12px}
.vcard{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:16px;cursor:pointer;transition:.14s;position:relative}
.vcard:hover{border-color:var(--ink3);transform:translateY(-1px);box-shadow:0 6px 18px -12px rgba(0,0,0,.4)}
.vcard.on{border-color:var(--marine);box-shadow:0 0 0 1px var(--marine),0 6px 18px -12px rgba(0,0,0,.4);background:var(--surface)}
.vcard .ico{width:34px;height:34px;border-radius:var(--r);background:var(--marineLo);color:var(--marine);display:grid;place-items:center;margin-bottom:11px}
.vcard.on .ico{background:var(--marine);color:#fff}
.vcard h4{font-size:14px;font-weight:600;margin-bottom:3px}
.vcard .cd{font-family:var(--mono);font-size:10px;color:var(--ink3);margin-bottom:7px}
.vcard p{font-size:12px;color:var(--ink2);line-height:1.5}
.vcard .st{margin-top:11px;padding-top:9px;border-top:1px solid var(--rule);display:flex;gap:14px}
.vcard .st div{font-family:var(--mono);font-size:10.5px;color:var(--ink3)}
.vcard .st b{color:var(--ink);font-weight:500}

/* stage chain */
.chain{display:flex;flex-direction:column;gap:0}
.stage{display:grid;grid-template-columns:26px 1fr;gap:12px}
.stage .gut{display:flex;flex-direction:column;align-items:center}
.stage .gut .no{width:22px;height:22px;border-radius:99px;border:1px solid var(--rule2);background:var(--surface);display:grid;place-items:center;font-family:var(--mono);font-size:9.5px;color:var(--ink3);margin-top:11px;flex-shrink:0}
.stage.on .gut .no{background:var(--marine);border-color:var(--marine);color:#fff}
.stage .gut .ln{flex:1;width:1px;background:var(--rule2);min-height:6px}
.stage:last-child .gut .ln{display:none}
.srow{display:flex;align-items:center;gap:12px;padding:11px 13px;margin:3px 0;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);cursor:pointer;transition:.12s}
.srow:hover{border-color:var(--ink3)}
.stage.on .srow{border-color:var(--rule2);background:var(--surface)}
.stage:not(.on) .srow{opacity:.5;background:transparent;border-style:dashed}
.srow .tx h5{font-size:13px;font-weight:600}
.srow .tx p{font-size:11.5px;color:var(--ink3);margin-top:1px}
.srow .meta{margin-left:auto;display:flex;align-items:center;gap:16px}
.srow .meta .u{font-family:var(--mono);font-size:10.5px;color:var(--ink3);text-align:right}
.tog{width:34px;height:19px;border-radius:99px;background:var(--rule2);position:relative;transition:.16s;flex-shrink:0}
.tog i{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:99px;background:#fff;transition:.16s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.tog.on{background:var(--marine)} .tog.on i{left:17px}
.arch{font-family:var(--cond);font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:2px;background:var(--surface3);color:var(--ink2)}

/* assemble */
#asm{display:grid;grid-template-columns:216px 1fr 348px;height:100%;overflow:hidden}
.col{overflow:auto;height:100%}
.colL{border-right:1px solid var(--rule);background:var(--surface2)}
.colR{border-left:1px solid var(--rule);background:var(--surface)}
.colhd{padding:11px 14px;border-bottom:1px solid var(--rule);background:var(--surface);position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px}
.sitem{display:flex;align-items:center;gap:9px;width:100%;padding:8px 14px;border-bottom:1px solid var(--rule);font-size:12px}
.sitem:hover{background:var(--surface)}
.sitem.on{background:var(--surface);box-shadow:inset 2px 0 0 var(--marine);font-weight:600}
.sitem.off{opacity:.42}
.sitem .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sitem .c{font-family:var(--mono);font-size:10px;color:var(--ink3)}

/* pipeline */
.pipe{padding:18px 20px}
.lane{margin-bottom:16px}
.lanehd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lanehd .k{width:6px;height:6px;border-radius:1px}
.nodes{display:flex;flex-wrap:wrap;align-items:stretch;gap:0}
.node{display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--surface);border:1px solid var(--rule2);border-radius:var(--r);min-width:174px;cursor:pointer;transition:.12s;position:relative}
.node:hover{border-color:var(--ink3);box-shadow:0 3px 10px -6px rgba(0,0,0,.4)}
.node.on{border-color:var(--marine);box-shadow:0 0 0 1px var(--marine)}
.node .ic{width:26px;height:26px;border-radius:var(--r);display:grid;place-items:center;flex-shrink:0}
.node .tx{min-width:0}
.node .tx b{font-size:12px;font-weight:600;display:block;line-height:1.25}
.node .tx span{font-family:var(--mono);font-size:9.5px;color:var(--ink3)}
.node .x{position:absolute;top:-6px;right:-6px;width:17px;height:17px;border-radius:99px;background:var(--ink);color:#fff;display:none;place-items:center;font-size:11px;line-height:1}
.node:hover .x{display:grid}
.node.locked{background:var(--surface2);border-style:dashed;cursor:default}
.node.locked:hover{border-color:var(--rule2);box-shadow:none}
.cn{display:grid;place-items:center;padding:0 6px;color:var(--rule2)}
.addb{display:flex;align-items:center;gap:7px;padding:9px 12px;border:1px dashed var(--rule2);border-radius:var(--r);color:var(--ink3);font-size:12px;min-width:120px;justify-content:center}
.addb:hover{border-color:var(--marine);color:var(--marine);background:var(--marineLo)}

.k-source{background:var(--slateLo);color:var(--slate)} .kb-source{background:var(--slate)}
.k-transform{background:var(--marineLo);color:var(--marine)} .kb-transform{background:var(--marine)}
.k-assist{background:var(--amberLo);color:var(--amber)} .kb-assist{background:var(--amber)}
.k-sink{background:var(--plumLo);color:var(--plum)} .kb-sink{background:var(--plum)}
.k-observer{background:var(--surface3);color:var(--ink2)} .kb-observer{background:var(--ink3)}
.k-platform{background:var(--surface3);color:var(--ink)} .kb-platform{background:var(--ink)}

/* inspector */
.insp{padding:14px}
.ihd{display:flex;align-items:center;gap:10px;margin-bottom:5px}
.ihd .ic{width:32px;height:32px;border-radius:var(--r);display:grid;place-items:center}
.ihd h4{font-size:14px;font-weight:600}
.ihd .id{font-family:var(--mono);font-size:10px;color:var(--ink3)}
.iblurb{font-size:12px;color:var(--ink2);line-height:1.5;margin:9px 0 13px;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11.5px;font-weight:500;margin-bottom:4px}
.fld .hlp{font-size:11px;color:var(--ink3);margin-top:3px;line-height:1.4}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea{width:100%;padding:5px 8px;border:1px solid var(--rule2);border-radius:var(--r);background:var(--surface);font-size:12px;font-family:var(--mono)}
.fld textarea{min-height:56px;resize:vertical;line-height:1.5}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--marine);outline:none;box-shadow:0 0 0 2px var(--marineLo)}
.fld.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.fld.row label{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.ch{padding:3px 9px;border:1px solid var(--rule2);border-radius:99px;font-size:11.5px;color:var(--ink2);background:var(--surface)}
.ch.on{background:var(--ink);border-color:var(--ink);color:#fff}
.hint{margin-top:12px;padding:9px 11px;background:var(--marineLo);border-left:2px solid var(--marine);border-radius:0 var(--r) var(--r) 0;font-size:11.5px;color:var(--ink2);line-height:1.5}
.hint b{color:var(--marine)}
.hint.w{background:var(--amberLo);border-color:var(--amber)} .hint.w b{color:var(--amber)}

/* palette */
.pal{position:fixed;inset:0;background:rgba(24,26,25,.42);display:grid;place-items:center;z-index:60;padding:24px}
.palbox{background:var(--paper);border-radius:6px;width:min(760px,100%);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 24px 60px -20px rgba(0,0,0,.5);overflow:hidden}
.palhd{padding:14px 16px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px;background:var(--surface)}
.palbody{overflow:auto;padding:14px 16px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(224px,1fr));gap:8px;margin-bottom:16px}
.pitem{display:flex;gap:9px;padding:10px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);cursor:pointer}
.pitem:hover{border-color:var(--marine);background:var(--marineLo)}
.pitem.dis{opacity:.4;cursor:not-allowed}
.pitem .ic{width:26px;height:26px;border-radius:var(--r);display:grid;place-items:center;flex-shrink:0}
.pitem b{font-size:12px;font-weight:600;display:block}
.pitem span{font-size:11px;color:var(--ink3);line-height:1.4;display:block;margin-top:1px}

/* review */
pre{font-family:var(--mono);font-size:11px;line-height:1.65;padding:15px;background:var(--ink);color:#CFD3D0;border-radius:var(--r);overflow:auto;max-height:460px}
pre .k{color:#7FC4AE}pre .v{color:#E3C88A}pre .c{color:#6B706D}pre .d{color:#C99BB4}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r)}
.cardh{padding:10px 14px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:9px}
.vres{display:flex;gap:9px;padding:8px 14px;border-bottom:1px solid var(--rule);font-size:12px;align-items:flex-start}
.vres:last-child{border:0}
.vres .g{color:var(--marine)}.vres .w{color:var(--amber)}.vres .e{color:var(--rust)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.btn{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border:1px solid var(--rule2);border-radius:var(--r);background:var(--surface);font-size:12px;font-weight:500}
.btn:hover{background:var(--surface2);border-color:var(--ink3)}
.btn.pri{background:var(--marine);border-color:var(--marine);color:#fff}.btn.pri:hover{background:var(--marineHi)}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--ink);color:#fff;padding:9px 15px;border-radius:var(--r);font-size:12px;opacity:0;pointer-events:none;transition:.26s;z-index:80;display:flex;gap:9px;align-items:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{padding:44px 20px;text-align:center;color:var(--ink3)}
.empty h4{font-size:13px;color:var(--ink2);margin-bottom:4px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@media(max-width:1080px){#asm{grid-template-columns:1fr}.colL,.colR{display:none}#meters{display:none}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="bd"><b>Malkom 3.0</b><span>Process assembler</span></div>
    <div id="steps"></div>
    <div id="meters"></div>
    <div class="rt">
      <button class="tbtn" data-a="import">Load</button>
      <button class="tbtn" data-a="export">Save</button>
      <button class="tbtn go" data-a="next">Continue</button>
    </div>
  </div>
  <div id="body"></div>
</div>
<div id="toast"><span id="tmsg"></span></div>

function loadVert(v){
  S.vert=v;S.on={};S.pipe={};S.cfg={};S.obs={};S.plat={};
  VERT[v].st.forEach(([id,,,def],i)=>{

  DEF_OBS.forEach(s=>{S.obs[s]=true;ensureCfg('_obs',s)});
  PLATFORM.forEach(s=>ensureCfg('_plat',s));
  S.stage=VERT[v].st[0][0];S.sel=null;
}
function ensureCfg(stage,svc){
  const key=stage+'::'+svc;
  if(S.cfg[key])return;
  const o={};(CAT[svc].cfg||[]).forEach(f=>o[f.k]=f.d);
  S.cfg[key]=o;
}
const cfgOf=(stage,svc)=>S.cfg[stage+'::'+svc]||{};

/* ═══════════════ METRICS ═══════════════ */
function metrics(){
  const stages=Object.keys(S.on).filter(k=>S.on[k]);
  let svc=0,custom=0,rpa=0,ai=0;
  stages.forEach(st=>(S.pipe[st]||[]).forEach(s=>{svc++;
    if(s==='code.custom')custom++; if(s==='out.rpa')rpa++;
    if(s.startsWith('ai.')||s.startsWith('idp.'))ai++;}));
  const obs=Object.keys(S.obs).filter(k=>S.obs[k]).length;
  const total=svc+obs+PLATFORM.length;
  // boundaries: idp + rpa calls are the real network crossings
  const bound=stages.length? Math.max(1,Math.round((ai+rpa)/Math.max(1,stages.length))+1):0;
  // setup estimate: config is fast, custom code and RPA are not
  const days = stages.length? Math.ceil(1.5 + stages.length*0.35 + custom*2 + rpa*1.5) : 0;
  const p95 = (1.2 + ai*0.35 + rpa*0.4).toFixed(1);
  return {stages:stages.length,total,bound,days,p95,custom};
}

/* step 4 — review */
function validate(){
  const r=[],V=VERT[S.vert];
  V.st.filter(s=>S.on[s[0]]).forEach(([id,n])=>{
    const p=S.pipe[id]||[];
    if(!p.some(s=>CAT[s].k==='source'))r.push(['e',`${n} — no intake service. Work cannot reach this process.`]);
    if(!p.some(s=>CAT[s].k==='sink'))r.push(['e',`${n} — no output service. Work has nowhere to go.`]);
    if(p.includes('idp.extract')&&!p.some(s=>CAT[s].k==='assist')&&cfgOf(id,'idp.extract').auto<0.97)
      r.push(['w',`${n} — auto-post threshold is ${cfgOf(id,'idp.extract').auto} with no human review configured.`]);
    if(p.includes('src.mailbox')&&cfgOf(id,'src.mailbox').ai&&!p.includes('ai.intent'))
      r.push(['w',`${n} — email intent is enabled but no intent service consumes it.`]);
    if(p.includes('out.rpa')&&cfgOf(id,'out.rpa').pool<2)
      r.push(['w',`${n} — RPA warm pool below 2. Expect cold-start latency on every post.`]);
  });
  if(!Object.values(S.obs).some(Boolean))r.push(['w','No observers enabled. Quality and metering cost nothing to add and cannot break a pipeline.']);
  if(Object.keys(S.on).filter(k=>S.on[k]).length===0)r.push(['e','No stages in scope.']);
  if(!r.some(x=>x[0]==='e'))r.unshift(['g','Composition valid — every edge type-checks and every capability resolves.']);
  return r;
}

       <button class="btn" style="margin-left:auto" data-close="1">Close</button></div>
     <div class="palbody"><div class="pgrid">
       ${list.map(([id,c])=>`<div class="pitem ${inPipe.includes(id)?'dis':''}" ${inPipe.includes(id)?'':`data-pick="${id}"`}>
          <span class="ic k-${c.k}">${ic(c.i)}</span>
          <div><b>${c.n}</b><span>${c.b}</span></div></div>`).join('')}
     </div></div>
   </div></div>`);
}
function closePal(){const p=document.getElementById('pal');if(p)p.remove()}

/* ═══════════════ IO ═══════════════ */
function exportJSON(){
  const blob=new Blob([JSON.stringify({v:1,vert:S.vert,on:S.on,pipe:S.pipe,cfg:S.cfg,obs:S.obs},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`malkom-${S.vert||'draft'}-blueprint.json`;a.click();
  toast('Saved — share the file, others load it here');
}
function importJSON(){
  const i=document.createElement('input');i.type='file';i.accept='.json';
  i.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const d=JSON.parse(r.result);
      S.vert=d.vert;S.on=d.on;S.pipe=d.pipe;S.cfg=d.cfg;S.obs=d.obs||{};
      S.stage=Object.keys(S.on).find(k=>S.on[k]);S.sel=null;S.step=2;render();
      toast('Loaded — assembled composition restored');
    }catch(err){toast('That file could not be read as a blueprint')}};
    r.readAsText(f)};
  i.click();
}
function toast(m){document.getElementById('tmsg').textContent=m;
  const t=document.getElementById('toast');t.classList.add('on');
  clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2600)}

/* ═══════════════ EVENTS ═══════════════ */
document.addEventListener('click',e=>{
  const t=e.target;
  const g=(a)=>t.closest(`[${a}]`);
  if(g('data-close')||t.id==='pal'){closePal();return}
  let x;
  if(x=g('data-step')){S.step=+x.dataset.step;render();return}
  if(x=g('data-vert')){loadVert(x.dataset.vert);render();return}
  if(x=g('data-stg')){const id=x.dataset.stg;S.on[id]=!S.on[id];render();return}
  if(x=g('data-stg2')){S.stage=x.dataset.stg2;S.sel=null;render();return}
  if(x=g('data-obs')){const s=x.dataset.obs;S.obs[s]=!S.obs[s];ensureCfg('_obs',s);if(S.obs[s])S.sel=s;render();return}
  if(x=g('data-del')){e.stopPropagation();S.pipe[S.stage]=S.pipe[S.stage].filter(s=>s!==x.dataset.del);
    if(S.sel===x.dataset.del)S.sel=null;render();return}
  if(x=g('data-svc')){S.sel=x.dataset.svc;render();return}
  if(x=g('data-add')){S.palKind=x.dataset.add;palette(S.palKind);return}
  if(x=g('data-pick')){const id=x.dataset.pick;S.pipe[S.stage].push(id);ensureCfg(S.stage,id);
    closePal();S.sel=id;render();toast(`${CAT[id].n} added`);return}
  if(x=g('data-tt')){
    const svc=x.dataset.cfg,fk=x.dataset.fk,tt=x.dataset.tt;
    const stage=x.dataset.plat?'_plat':(CAT[svc].k==='observer'?'_obs':S.stage);
    const c=S.cfg[stage+'::'+svc];
    if(tt==='tog'){c[fk]=!c[fk];render()}
    if(tt==='chip'){const v=x.dataset.val;c[fk]=c[fk]||[];
      c[fk]=c[fk].includes(v)?c[fk].filter(y=>y!==v):[...c[fk],v];render()}
    return}
  if(x=g('data-a')){
    const a=x.dataset.a;
    if(a==='export')exportJSON();
    if(a==='import')importJSON();
    if(a==='copy'){const el=document.getElementById('yml');
      navigator.clipboard?.writeText(el.innerText).then(()=>toast('Blueprint copied'));}
    if(a==='next'){if(S.step===0&&!S.vert){toast('Choose a business model first');return}
      S.step=Math.min(4,S.step+1);render()}
    return}
});
document.addEventListener('change',e=>{
  const x=e.target.closest('[data-tt="val"]');if(!x)return;
  const svc=x.dataset.cfg,fk=x.dataset.fk;
  const stage=x.dataset.plat?'_plat':(CAT[svc].k==='observer'?'_obs':S.stage);
  const f=CAT[svc].cfg.find(y=>y.k===fk);
  S.cfg[stage+'::'+svc][fk]= f.t==='num'? parseFloat(x.value): x.value;
  drawMeters();
  if(f.if||CAT[svc].cfg.some(y=>y.if))render();
});

render();
</script>
</body>
</html>
